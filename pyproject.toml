[build-system]
requires = ["setuptools>=77", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "receipet"
version = "0.2.0"
description = "Monochrome image buffer with ESC/POS, ESC/P, TSPL, CPCL, ZPL and Brother QL output"
readme = "README.md"
requires-python = ">=3.12"
# Private, not open source. LicenseRef- is PEP 639's form for a licence that is not in the SPDX list.
license = "LicenseRef-Proprietary"
# PyPI rejects any "Private ::" classifier, so a stray `twine upload` fails instead of publishing this.
classifiers = ["Private :: Do Not Upload"]
dependencies = ["cffi>=1.15"]

# `uv sync` installs these on top of the runtime dependency, which is what
# the in-place build in the Makefile needs.
[dependency-groups]
dev = [
    "setuptools>=61",
    "cffi>=1.15",
    "ruff>=0.6",
    "pillow>=12.3.0",
]

[tool.ruff]
line-length = 150          # same ceiling as the C side
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.setuptools]
packages = ["receipet"]

[tool.setuptools.package-dir]
receipet = "packages/python/cffi-port/receipet"
