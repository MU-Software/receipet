name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uvx pre-commit run --all-files
      - run: make version-check

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - name: Address and undefined behavior sanitizers
        run: |
          make clean
          make test CC=clang CFLAGS="-O1 -g -std=c99 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Iinclude -Isrc -fsanitize=address,undefined -fno-omit-frame-pointer"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: make python-test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make wasm-test
